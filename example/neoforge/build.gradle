plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Twigonometry: referencing parent properties so i dont have to write them every time, you can delete this
def parentProps = new Properties()
file('../../gradle.properties').withInputStream { parentProps.load(it) }
ext {
    root_version = parentProps.getProperty('version')
    root_minecraft_version = parentProps.getProperty('minecraft_version')
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            //
            // Vanilla setup: added common resource folder to sources
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }

        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation 'thedarkcolour:kotlinforforge-neoforge:5.10.0'
    // Twigonometry: referencing local maven, use the Modrinth maven repository instead!
    implementation group: 'dev.maksiks.twigonometry', name: "twigonometry-neoforge-${root_minecraft_version}", version: "${root_version}"
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}